apiVersion: apps/v1
kind: Deployment
metadata:
  name: devopsx-task-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devopsx-task-manager
  template:
    metadata:
      labels:
        app: devopsx-task-manager
    spec:
      containers:
        - name: devopsx-task-manager
          image: devopsx-task-manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15