apiVersion: apps/v1
kind: Deployment
metadata:
  name: devopsx-task-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devopsx-task-manager
  template:
    metadata:
      labels:
        app: devopsx-task-manager
    spec:
      containers:
        - name: devopsx-task-manager
          image: devopsx-task-manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080